name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check=${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The ruleset's required status check must match this job name exactly
  pr-check:
    name: pr-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # TODO: pin by SHA before 2.0.0 - no precedent in HarborRAg  to copy,
      # Dependabot's first PR will convert it.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json # reads the packageManager pin

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: website
        run: pnpm typecheck

      # onBrokenLinks/onBrokenAnchors/onBrokenMarkdownLinks are all 'throw',
      # so a successful build is the link check. No separate tool needed.
      - name: Build
        working-directory: website
        run: pnpm build

      # TODO (at i guess phase 6): assert `three` is absent from the docs chunks

      - name: Upload site preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-pr-${{ github.event.pull_request.number }}
          path: website/build
          retention-days: 7
