name: PR check

on:
  pull_request:
    branches: 
      - main
      - develop
      - test/manual-sync-workflow

permissions:
  contents: read

concurrency:
  group: pr-check=${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The ruleset's required status check must match this job name exactly
  pr-check:
    name: pr-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Ingest: install, test, lint (fast, so it runs first and fails early)
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.12'

      - name: Install ingest dependencies
        working-directory: scripts/ingest
        run: uv sync --frozen

      - name: Run ingest tests
        working-directory: scripts/ingest
        run: uv run pytest

      - name: Check ingest lint
        working-directory: scripts/ingest
        run: uv run ruff check .
      
      # Workflow: actionlint
      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      # Website: install, typecheck, build
      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
        with:
          package_json_file: website/package.json # reads the packageManager pin

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: website
        run: pnpm typecheck

      # onBrokenLinks/onBrokenAnchors/onBrokenMarkdownLinks are all 'throw',
      # so a successful build is the link check. No separate tool needed.
      - name: Build
        working-directory: website
        run: pnpm build

      # TODO (at i guess phase 6): assert `three` is absent from the docs chunks

      - name: Upload site preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-pr-${{ github.event.pull_request.number }}
          path: website/build
          retention-days: 7
